name: Publish Windows release

on:
  push:
    branches: [main]
    paths:
      - MikroTikManager.csproj
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/windows-build.yml
  release:
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content MikroTikManager.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Download tested executable and installer
        uses: actions/download-artifact@v4
        with:
          name: MikroTikManager-win-x64
          path: release

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $exe = "release/win-x64/MikroTikManager.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MikroTikManager.exe" |
            Set-Content "release/win-x64/MikroTikManager.exe.sha256.txt"

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = "release/win-x64/MikroTikManager.exe"
          $checksum = "$exe.sha256.txt"
          $setup = "release/installer/MikroTikManager-Setup.exe"
          $setupChecksum = "$setup.sha256.txt"

          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $exe $checksum $setup $setupChecksum --clobber
          }
          else {
            gh release create $env:TAG $exe $checksum $setup $setupChecksum `
              --title "MikroTik Manager $env:VERSION" `
              --notes "Windows x64 release. Download MikroTikManager-Setup.exe for installation and the background scheduler service, or MikroTikManager.exe for portable mode and verify it with the accompanying SHA-256 checksum. MikroTik, RouterOS, RouterBOARD and WinBox are trademarks of MikroTikls SIA. This independent Indigo project is not affiliated with, sponsored by or endorsed by MikroTikls SIA."
          }
